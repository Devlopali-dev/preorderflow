services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      target: dev
    command: pnpm --filter api dev
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
    environment:
      NODE_ENV: development
      # Pas de limites de débit en développement : la suite E2E locale dépasserait vite les seuils.
      # Jamais en production (docker-compose.yml ne la pose pas).
      RATE_LIMIT_DISABLED: "true"

  web:
    build:
      target: dev
    command: pnpm --filter web dev
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
    environment:
      NODE_ENV: development
