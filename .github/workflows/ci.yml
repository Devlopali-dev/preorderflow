name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: preorderflow
          POSTGRES_PASSWORD: preorderflow
          POSTGRES_DB: preorderflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preorderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://preorderflow:preorderflow@localhost:5432/preorderflow?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      TZ: UTC
      # La suite E2E enchaîne bien plus d'appels que les seuils (login, recensement, commande publique…) :
      # les limites de débit sont coupées pour elle. Elles sont vérifiées à part, sur une seconde API
      # démarrée SANS cette variable (cf. rate-limit.spec.ts).
      RATE_LIMIT_DISABLED: "true"
      # Secrets applicatifs : valeurs de test uniquement, jamais celles de
      # production (cf. .env.example). Nécessaires pour que login admin,
      # magic link client, et les sessions signées fonctionnent réellement
      # pendant les tests e2e — sans eux JwtService signe/vérifie avec un
      # secret undefined et tout le flux auth échoue silencieusement.
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRES_IN: 1d
      MAGIC_LINK_SECRET: ci-test-magic-link-secret
      MAGIC_LINK_EXPIRES_IN: 15m
      SESSION_COOKIE_SECRET: ci-test-session-cookie-secret
      API_PORT: 3001
      API_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000
      WEB_PORT: 3000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Requis par order-payment.spec.ts (le QR code Revolut ne s'affiche
      # que si ce lien est configuré).
      REVOLUT_PAYMENT_LINK: https://revolut.me/ci-test
      EMAIL_FROM: "PreOrderFlow <no-reply@example.com>"

    steps:
      - uses: actions/checkout@v7

      # Toute la branche pnpm 11.x (pas juste 11.28) exige Node >= 22.13 —
      # confirmé en réel : 11.3.0 échoue exactement pareil sous Node 20
      # (ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite). Contrainte de l'outil de
      # build en CI, indépendante du runtime : Docker (node:20-alpine) et
      # `engines` du package.json restent sur Node 20 pour l'app elle-même.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm --filter @preorderflow/database migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # Démarrage de l'API + e2e dans le MÊME step : GitHub Actions termine
      # le groupe de processus à la fin de chaque step, donc un serveur
      # lancé en arrière-plan (même avec nohup) dans un step séparé est tué
      # avant que le step suivant ne démarre — l'API répondait bien à
      # /health juste après son lancement, puis devenait injoignable dès le
      # step "E2E tests" (ECONNREFUSED). Un seul step évite la coupure.
      - name: Start API server and run E2E tests
        env:
          PREORDERFLOW_API_LOG_PATH: ${{ github.workspace }}/api.log
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          API_PID=$!
          # Seconde API, limites de débit ACTIVES, pour rate-limit.spec.ts uniquement.
          RATE_LIMIT_DISABLED=false API_PORT=3102 node apps/api/dist/main.js > api-limited.log 2>&1 &
          LIMITED_PID=$!
          trap "kill $API_PID $LIMITED_PID 2>/dev/null" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "API prête"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API n'a pas démarré à temps"
              cat api.log
              exit 1
            fi
            sleep 1
          done

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3102/health > /dev/null; then
              echo "API (limites actives) prête"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API (limites actives) n'a pas démarré à temps"
              cat api-limited.log
              exit 1
            fi
            sleep 1
          done

          RATE_LIMIT_API_URL=http://localhost:3102 pnpm test:e2e

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: |
            api.log
            api-limited.log

  # Image de PRODUCTION : construit et démarre la stack de production
  # (docker-compose.prod.yml) puis vérifie qu'elle répond. Les tests ci-dessus ne passent jamais par
  # ces Dockerfiles : une image qui ne démarre pas (moteur Prisma introuvable, build web qui échoue,
  # migrations non appliquées…) n'était détectée qu'au déploiement.
  docker-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the production stack
        run: |
          cat > ci.env <<'EOF'
          POSTGRES_USER=pof
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=pof
          JWT_SECRET=ci-test-jwt-secret
          MAGIC_LINK_SECRET=ci-test-magic-link-secret
          SESSION_COOKIE_SECRET=ci-test-session-cookie-secret
          WEB_URL=http://localhost:3200
          CORS_ORIGIN=http://localhost:3200
          NEXT_PUBLIC_API_URL=http://localhost:3201
          EOF
          cat > ci-ports.yml <<'EOF'
          services:
            api:
              ports: ["3201:3001"]
            web:
              ports: ["3200:3000"]
          EOF
          docker compose -f docker-compose.prod.yml -f ci-ports.yml --env-file ci.env up -d --build --wait --wait-timeout 300

      - name: Smoke test
        env:
          SMOKE_EXPECT_API_URL: http://localhost:3201
        run: ./scripts/smoke-production.sh -f docker-compose.prod.yml -f ci-ports.yml --env-file ci.env

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f ci-ports.yml --env-file ci.env logs --no-color --tail=200
