name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: preorderflow
          POSTGRES_PASSWORD: preorderflow
          POSTGRES_DB: preorderflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preorderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://preorderflow:preorderflow@localhost:5432/preorderflow?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      TZ: UTC
      # Secrets applicatifs : valeurs de test uniquement, jamais celles de
      # production (cf. .env.example). Nécessaires pour que login admin,
      # magic link client, et les sessions signées fonctionnent réellement
      # pendant les tests e2e — sans eux JwtService signe/vérifie avec un
      # secret undefined et tout le flux auth échoue silencieusement.
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRES_IN: 1d
      MAGIC_LINK_SECRET: ci-test-magic-link-secret
      MAGIC_LINK_EXPIRES_IN: 15m
      SESSION_COOKIE_SECRET: ci-test-session-cookie-secret
      API_PORT: 3001
      API_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000
      WEB_PORT: 3000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Requis par order-payment.spec.ts (le QR code Revolut ne s'affiche
      # que si ce lien est configuré).
      REVOLUT_PAYMENT_LINK: https://revolut.me/ci-test
      EMAIL_FROM: "PreOrderFlow <no-reply@example.com>"

    steps:
      - uses: actions/checkout@v4

      # Version exacte (pas juste "11") : pnpm 11.28 exige Node >= 22.13
      # et casse sous Node 20 (ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite),
      # confirmé en réel sur ce pipeline. Le reste du projet (Docker,
      # engines) est sur Node 20 — on épingle plutôt pnpm à la version
      # utilisée en dev local (11.3.0) que de faire remonter Node partout.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm --filter @preorderflow/database migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # Démarrage de l'API + e2e dans le MÊME step : GitHub Actions termine
      # le groupe de processus à la fin de chaque step, donc un serveur
      # lancé en arrière-plan (même avec nohup) dans un step séparé est tué
      # avant que le step suivant ne démarre — l'API répondait bien à
      # /health juste après son lancement, puis devenait injoignable dès le
      # step "E2E tests" (ECONNREFUSED). Un seul step évite la coupure.
      - name: Start API server and run E2E tests
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID 2>/dev/null" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "API prête"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API n'a pas démarré à temps"
              cat api.log
              exit 1
            fi
            sleep 1
          done

          pnpm test:e2e

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: api.log
